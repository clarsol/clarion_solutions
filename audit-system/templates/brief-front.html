<style>
  @page { size: letter; margin: 14mm; }
  * { box-sizing: border-box; }
  html, body {
    background: #ffffff;
    color: #1a1a1a;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 11pt;
    line-height: 1.42;
    margin: 0;
    padding: 0;
  }
  .header {
    border-bottom: 2px solid #1a1a1a;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 20pt;
    margin: 0 0 4px 0;
  }
  .header .addr {
    font-size: 11pt;
    color: #333333;
    margin: 0 0 6px 0;
  }
  .header .prepared {
    font-size: 10pt;
    color: #555555;
    font-style: italic;
    margin: 0;
  }
  h2 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12.5pt;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-left: 4px solid #1a1a1a;
    padding-left: 8px;
    margin: 18px 0 8px 0;
  }
  ul { margin: 0 0 0 0; padding-left: 20px; }
  li { margin-bottom: 6px; }
  .cost-item { margin-bottom: 10px; }
  .cost-item .headline { font-weight: bold; }
  .cost-item .detail { margin: 2px 0; }
  .cost-item .cost { font-style: italic; }

  /* Score block, shown only when the overall score is >= 30 */
  .score-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 16px 0 18px 0;
    padding: 10px 14px;
    border: 1px solid #999999;
  }
  .score-block .number {
    font-size: 24pt;
    font-weight: bold;
    font-family: Arial, Helvetica, sans-serif;
  }
  .score-block .label {
    font-size: 10pt;
    color: #444444;
  }

  /* Hero evidence block, shown instead of a score when the score is suppressed */
  .hero-evidence {
    margin: 16px 0 18px 0;
    padding: 10px 14px;
    border-left: 4px solid #1a1a1a;
    font-style: italic;
    color: #222222;
  }

  .footer {
    margin-top: 16px;
    font-size: 10pt;
    color: #555555;
  }
</style>
</head>
